<h1 class="h3 mb-4">Orders</h1>

<div class="mb-3" style="max-width: 240px;">
  <select class="form-select form-select-sm" [(ngModel)]="statusFilter" (ngModelChange)="page = 1; load()">
    <option value="">All statuses</option>
    @for (status of statuses; track status) {
      <option [value]="status">{{ status }}</option>
    }
  </select>
</div>

@if (result()) {
  <div class="table-responsive">
    <table class="table align-middle">
      <thead><tr><th>Order #</th><th>Date</th><th>Items</th><th>Total</th><th>Payment</th><th>Status</th><th></th></tr></thead>
      <tbody>
        @for (order of result()!.items; track order.id) {
          <tr>
            <td class="fw-semibold">{{ order.orderNumber }}</td>
            <td class="small text-muted">{{ order.createdAt | date: 'mediumDate' }}</td>
            <td>{{ order.itemCount }}</td>
            <td>{{ formatVnd(order.total) }}</td>
            <td><span class="badge text-bg-light border">{{ order.paymentStatus }}</span></td>
            <td><span class="badge text-bg-primary">{{ order.status }}</span></td>
            <td><a [routerLink]="['/admin/orders', order.id]" class="btn btn-sm btn-outline-primary">View</a></td>
          </tr>
        }
      </tbody>
    </table>
  </div>

  <app-pagination [page]="result()!.page" [totalPages]="result()!.totalPages" (pageChange)="onPageChange($event)"></app-pagination>
}
