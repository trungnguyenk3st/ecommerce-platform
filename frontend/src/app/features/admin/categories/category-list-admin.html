<div class="d-flex justify-content-between align-items-center mb-4">
  <h1 class="h3 mb-0">Categories</h1>
  <button class="btn btn-primary btn-sm" (click)="startCreate()"><i class="bi bi-plus-lg me-1"></i>New category</button>
</div>

@if (showForm()) {
  <div class="card p-3 mb-4" style="max-width: 600px;">
    <form [formGroup]="form" (ngSubmit)="save()">
      <div class="row g-2">
        <div class="col-md-6">
          <label class="form-label small">Name</label>
          <input class="form-control" formControlName="name">
        </div>
        <div class="col-md-6">
          <label class="form-label small">Parent category</label>
          <select class="form-select" formControlName="parentCategoryId">
            <option [ngValue]="null">None (top-level)</option>
            @for (category of categories(); track category.id) {
              @if (category.id !== editingId()) {
                <option [ngValue]="category.id">{{ category.name }}</option>
              }
            }
          </select>
        </div>
        <div class="col-12">
          <label class="form-label small">Description</label>
          <textarea class="form-control" rows="2" formControlName="description"></textarea>
        </div>
        <div class="col-md-8">
          <label class="form-label small">Image URL</label>
          <input class="form-control" formControlName="imageUrl">
        </div>
        <div class="col-md-4">
          <label class="form-label small">Display order</label>
          <input type="number" class="form-control" formControlName="displayOrder">
        </div>
        <div class="col-12">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="catActive" formControlName="isActive">
            <label class="form-check-label small" for="catActive">Active</label>
          </div>
        </div>
      </div>

      <div class="d-flex gap-2 mt-3">
        <button type="submit" class="btn btn-primary btn-sm" [disabled]="saving()">Save category</button>
        <button type="button" class="btn btn-outline-secondary btn-sm" (click)="cancel()">Cancel</button>
      </div>
    </form>
  </div>
}

<div class="table-responsive">
  <table class="table align-middle">
    <thead><tr><th>Name</th><th>Parent</th><th>Products</th><th>Status</th><th></th></tr></thead>
    <tbody>
      @for (category of categories(); track category.id) {
        <tr>
          <td>{{ category.name }}</td>
          <td class="small text-muted">{{ categories().find(c => c.id === category.parentCategoryId)?.name || '—' }}</td>
          <td>{{ category.productCount }}</td>
          <td>
            @if (category.isActive) { <span class="badge text-bg-success">Active</span> } @else { <span class="badge text-bg-secondary">Inactive</span> }
          </td>
          <td class="text-end">
            <button class="btn btn-sm btn-outline-secondary" (click)="startEdit(category)"><i class="bi bi-pencil"></i></button>
            <button class="btn btn-sm btn-outline-danger" (click)="delete(category.id)"><i class="bi bi-trash"></i></button>
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
