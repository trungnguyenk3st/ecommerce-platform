<div class="container py-4">
  <h1 class="h3 mb-4">Your wishlist</h1>

  @if (wishlist.items().length === 0) {
    <div class="text-center py-5">
      <i class="bi bi-heart fs-1 text-muted d-block mb-3"></i>
      <p class="text-muted">Your wishlist is empty.</p>
      <a routerLink="/products" class="btn btn-primary">Browse products</a>
    </div>
  } @else {
    <div class="row g-3">
      @for (item of wishlist.items(); track item.id) {
        <div class="col-6 col-md-4 col-lg-3">
          <div class="card h-100">
            <a [routerLink]="['/products', item.productSlug]">
              <img
                [src]="item.productImageUrl || 'https://placehold.co/300x300?text=No+Image'"
                class="card-img-top"
                style="aspect-ratio: 1; object-fit: cover;"
                alt="">
            </a>
            <div class="card-body d-flex flex-column">
              <a [routerLink]="['/products', item.productSlug]" class="text-decoration-none text-reset">
                <h6 class="text-truncate-2">{{ item.productName }}</h6>
              </a>
              <p class="fw-bold mb-2">{{ formatVnd(item.price) }}</p>
              <div class="mt-auto d-flex gap-2">
                <button class="btn btn-primary btn-sm flex-grow-1" [disabled]="!item.inStock" (click)="addToCart(item.productId)">Add to cart</button>
                <button class="btn btn-outline-danger btn-sm" (click)="remove(item.productId)"><i class="bi bi-trash"></i></button>
              </div>
            </div>
          </div>
        </div>
      }
    </div>
  }
</div>
